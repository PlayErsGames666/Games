<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змейка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ctext%20x='32'%20y='48'%20font-size='54'%20text-anchor='middle'%3E🐍%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../../shared/base.css?v=20260817-5">
<link rel="stylesheet" href="style.css?v=20260817-5">
</head>
<body>
<div class="stage">
<div class="game-col">
  <h1>🐍 ЗМЕЙКА</h1>

  <div class="controls">
    <a href="../../index.html" style="background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;">← Меню</a>
    <button id="fsBtn" class="fsbtn" title="Полный экран (F)">⛶ Во весь экран</button>
    <select id="difficulty">
      <option value="140">Медленно</option>
      <option value="100" selected>Средне</option>
      <option value="65">Быстро</option>
    </select>
    <label style="display:flex;align-items:center;gap:6px;font-size:14px;">
      <input type="checkbox" id="walls"> Стены (без прохода сквозь края)
    </label>
    <button id="restart">🔄 Заново</button>
  </div>

  <div class="status">
    <span>🍎 <span id="score">0</span></span>
    <span>🏆 <span id="best">0</span></span>
  </div>

  <canvas id="game" width="500" height="500"></canvas>

  <div class="hint">Стрелки ← ↑ → ↓ или W A S D · Пробел — пауза</div>
</div>
<aside class="guide-panel">
  <h2>🎛 Справочник</h2>
  <div class="row"><span class="keys"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></span><span class="desc">направление</span></div>
  <div class="row"><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span class="desc">направление</span></div>
  <div class="row"><span class="keys"><kbd>Space</kbd></span><span class="desc">пауза / продолжить</span></div>
  <div class="sep"></div>
  <div class="note">WASD = ЦФЫВ в рус. раскладке. Развернуться на 180° сразу нельзя.</div>
</aside>
</div>

<script src="game.js?v=20260817-5"></script>

<script src="../../shared/fullscreen.js?v=20260817-5"></script>
</body>
</html>
