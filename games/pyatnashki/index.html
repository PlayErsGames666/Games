<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пятнашки</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ctext%20x='32'%20y='48'%20font-size='54'%20text-anchor='middle'%3E🔢%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../../shared/base.css?v=20260819-17">
<link rel="stylesheet" href="style.css?v=20260819-17">
</head>
<body>
<div class="stage">
<div class="game-col">
  <h1>🔢 ПЯТНАШКИ</h1>

  <div class="controls">
    <a href="../../index.html" style="background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;">← Меню</a>
    <button id="fsBtn" class="fsbtn" title="Полный экран (F)">⛶ Во весь экран</button>
    <select id="size">
      <option value="3">3 × 3</option>
      <option value="4" selected>4 × 4 (классика)</option>
      <option value="5">5 × 5</option>
    </select>
    <button id="shuffle">🔀 Перемешать</button>
  </div>

  <div class="status">
    <span>🎯 <span id="moves">0</span></span>
    <span>⏱️ <span id="timer">0</span></span>
  </div>

  <div id="board"></div>

  <div class="message" id="message"></div>
  <div class="hint">Кликай по фишке рядом с пустой клеткой · или используй стрелки ← ↑ → ↓</div>
</div>
<aside class="guide-panel">
  <h2>🎛 Справочник</h2>
  <div class="row"><span class="keys"><kbd>↑</kbd></span><span class="desc">фишку снизу — вверх</span></div>
  <div class="row"><span class="keys"><kbd>↓</kbd></span><span class="desc">фишку сверху — вниз</span></div>
  <div class="row"><span class="keys"><kbd>←</kbd></span><span class="desc">фишку справа — влево</span></div>
  <div class="row"><span class="keys"><kbd>→</kbd></span><span class="desc">фишку слева — вправо</span></div>
  <div class="row"><span class="keys"><kbd>ЛКМ</kbd></span><span class="desc">сдвинуть фишку у пустой клетки</span></div>
  <div class="sep"></div>
  <div class="note">Расставь числа по порядку, пустая клетка — в углу.</div>
</aside>
</div>

<script src="game.js?v=20260819-17"></script>

<script src="../../shared/fullscreen.js?v=20260819-17"></script>
</body>
</html>
