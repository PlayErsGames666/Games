<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Печенька-кликер</title>
<style>
  :root {
    --bg: #2b2d42;
    --panel: #3a3d5c;
    --panel2: #4a4e73;
    --text: #edf2f4;
    --accent: #ffd166;
    --good: #06d6a0;
    --bad: #8d99ae;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    user-select: none;
  }
  h1 { text-align: center; margin-bottom: 6px; letter-spacing: 1px; }
  .layout {
    display: flex;
    gap: 24px;
    max-width: 900px;
    margin: 0 auto;
    flex-wrap: wrap;
    justify-content: center;
  }
  /* левая колонка — печенька */
  .cookie-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 300px;
    flex: 1;
  }
  .counter {
    font-size: 34px;
    font-weight: bold;
    color: var(--accent);
    margin: 10px 0 2px;
  }
  .per-sec { font-size: 15px; opacity: .8; margin-bottom: 16px; }
  #cookie {
    font-size: 150px;
    cursor: pointer;
    transition: transform .05s;
    line-height: 1;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,.4));
  }
  #cookie:active { transform: scale(0.92); }
  .per-click { font-size: 14px; opacity: .7; margin-top: 12px; }

  /* правая колонка — магазин */
  .shop {
    min-width: 320px;
    flex: 1;
  }
  .shop h2 { margin-bottom: 10px; font-size: 20px; }
  .item {
    background: var(--panel);
    border: none;
    color: var(--text);
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background .12s, opacity .12s;
  }
  .item:hover:not(:disabled) { background: var(--panel2); }
  .item:disabled { opacity: .45; cursor: not-allowed; }
  .item .emoji { font-size: 30px; }
  .item .info { flex: 1; }
  .item .name { font-weight: bold; font-size: 16px; }
  .item .desc { font-size: 12px; opacity: .75; }
  .item .right { text-align: right; }
  .item .cost { color: var(--accent); font-weight: bold; }
  .item .owned { font-size: 20px; font-weight: bold; opacity: .85; }

  .controls { text-align: center; margin-top: 20px; }
  .controls button {
    background: var(--panel);
    color: var(--text);
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    margin: 0 4px;
  }
  .controls button:hover { background: var(--panel2); }

  /* всплывающие +N при клике */
  .float {
    position: fixed;
    pointer-events: none;
    font-size: 22px;
    font-weight: bold;
    color: var(--accent);
    animation: floatUp .8s ease-out forwards;
    z-index: 10;
  }
  @keyframes floatUp {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-70px); }
  }
  .stage { display:flex; gap:28px; align-items:flex-start; justify-content:center; flex-wrap:wrap; width:100%; max-width:100%; }
  .game-col { display:flex; flex-direction:column; align-items:center; max-width:100%; min-width:0; }
  .guide-panel {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 16px 18px;
    min-width: 215px;
    max-width: 260px;
    margin-top: 56px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .guide-panel h2 { font-size:14px; letter-spacing:1px; text-transform:uppercase; opacity:.85; margin-bottom:14px; display:flex; align-items:center; gap:7px; }
  .guide-panel .row { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13.5px; }
  .guide-panel .keys { display:flex; gap:4px; flex-shrink:0; }
  .guide-panel .desc { opacity:.85; }
  .guide-panel .sep { height:1px; background:rgba(255,255,255,.09); margin:12px 0; }
  .guide-panel .note { font-size:12px; opacity:.6; margin-top:8px; line-height:1.55; }
  kbd {
    display:inline-block; min-width:22px; text-align:center;
    background:#20223a; border:1px solid rgba(255,255,255,.15);
    border-bottom-width:2px; border-radius:6px; padding:3px 6px;
    font-family:inherit; font-size:12px; font-weight:bold; color:var(--text);
  }
  @media (max-width:760px){ .guide-panel{ margin-top:8px; max-width:100%; width:100%; } }
  @media (max-width:600px){
    body{ padding:12px; }
    h1{ font-size:26px; }
    .cookie-side, .shop{ min-width:0; width:100%; flex:1 1 100%; }
    #cookie{ font-size:110px; }
    .counter{ font-size:28px; }
  }

  /* --- полноэкранный режим --- */
  .fsbtn.on { background:#06d6a0; color:#10121f; }
  :fullscreen { overflow:auto; }
  :fullscreen .guide-panel { display:none; }        /* в полный экран — только игра */
  :fullscreen .stage { gap:0; }
  :fullscreen canvas { height:min(76vh,calc(100vh - 210px)); width:auto; max-width:97vw; }
  :fullscreen #board { transform-origin:top center; }
</style>
</head>
<body>
<div class="stage">
<div class="game-col">
  <h1>🍪 ПЕЧЕНЬКА-КЛИКЕР</h1>
  <div class="controls">
    <a href="../../index.html" style="background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;">← Меню</a>
    <button id="fsBtn" class="fsbtn" title="Полный экран (F)">⛶ Во весь экран</button>
  </div>

  <div class="layout">
    <div class="cookie-side">
      <div class="counter"><span id="count">0</span> печенек</div>
      <div class="per-sec"><span id="cps">0</span> в секунду</div>
      <div id="cookie">🍪</div>
      <div class="per-click">+<span id="perClick">1</span> за клик</div>
    </div>

    <div class="shop">
      <h2>🏪 Магазин</h2>
      <div id="shop"></div>
      <div class="controls">
        <button id="save">💾 Сохранить</button>
        <button id="reset">🗑️ Сброс</button>
      </div>
    </div>
  </div>
</div>
<aside class="guide-panel">
  <h2>🎛 Справочник</h2>
  <div class="row"><span class="keys"><kbd>ЛКМ</kbd></span><span class="desc">клик по печеньке 🍪</span></div>
  <div class="row"><span class="keys"><kbd>ЛКМ</kbd></span><span class="desc">покупка улучшения в магазине</span></div>
  <div class="sep"></div>
  <div class="note">Управление только мышью. Улучшения дают печеньки в секунду, перчатки усиливают клик. Прогресс автосохраняется.</div>
</aside>
</div>

<script>
// Определения улучшений.
// base — базовая цена, cps — печенек в секунду за штуку, click — прибавка к клику
const ITEMS = [
  { id: 'cursor',  emoji: '👆', name: 'Курсор',       desc: '+0.1/сек',  base: 15,      cps: 0.1,  click: 0 },
  { id: 'grandma', emoji: '👵', name: 'Бабушка',      desc: '+1/сек',    base: 100,     cps: 1,    click: 0 },
  { id: 'glove',   emoji: '🧤', name: 'Перчатка',     desc: '+1 за клик',base: 250,     cps: 0,    click: 1 },
  { id: 'farm',    emoji: '🌾', name: 'Ферма',        desc: '+8/сек',    base: 1100,    cps: 8,    click: 0 },
  { id: 'factory', emoji: '🏭', name: 'Фабрика',      desc: '+47/сек',   base: 12000,   cps: 47,   click: 0 },
  { id: 'bank',    emoji: '🏦', name: 'Банк',         desc: '+260/сек',  base: 130000,  cps: 260,  click: 0 },
  { id: 'temple',  emoji: '🏛️', name: 'Храм',         desc: '+1400/сек', base: 1400000, cps: 1400, click: 0 },
];

const SAVE_KEY = 'cookieClickerSave';

let state = {
  cookies: 0,
  owned: {},      // id -> количество
};

// восстановить сохранение
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      state.cookies = s.cookies || 0;
      state.owned = s.owned || {};
    }
  } catch (e) { /* игнорируем битое сохранение */ }
  ITEMS.forEach(it => { if (state.owned[it.id] == null) state.owned[it.id] = 0; });
}

function save() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

// цена растёт на 15% за каждую купленную штуку (как в оригинале)
function costOf(item) {
  return Math.ceil(item.base * Math.pow(1.15, state.owned[item.id]));
}

function perClick() {
  let bonus = 1;
  ITEMS.forEach(it => bonus += it.click * state.owned[it.id]);
  return bonus;
}

function perSecond() {
  let cps = 0;
  ITEMS.forEach(it => cps += it.cps * state.owned[it.id]);
  return cps;
}

// красивое форматирование больших чисел
function fmt(num) {
  if (num < 1000) return Number.isInteger(num) ? num : num.toFixed(1);
  const units = ['', ' тыс', ' млн', ' млрд', ' трлн'];
  let u = 0;
  while (num >= 1000 && u < units.length - 1) { num /= 1000; u++; }
  return num.toFixed(2) + units[u];
}

const countEl = document.getElementById('count');
const cpsEl = document.getElementById('cps');
const perClickEl = document.getElementById('perClick');
const shopEl = document.getElementById('shop');
const cookieEl = document.getElementById('cookie');

function buildShop() {
  shopEl.innerHTML = '';
  ITEMS.forEach(it => {
    const btn = document.createElement('button');
    btn.className = 'item';
    btn.id = 'item-' + it.id;
    btn.innerHTML = `
      <span class="emoji">${it.emoji}</span>
      <span class="info">
        <span class="name">${it.name}</span><br>
        <span class="desc">${it.desc}</span>
      </span>
      <span class="right">
        <div class="cost" id="cost-${it.id}"></div>
        <div class="owned" id="owned-${it.id}"></div>
      </span>`;
    btn.addEventListener('click', () => buy(it));
    shopEl.appendChild(btn);
  });
}

function buy(item) {
  const cost = costOf(item);
  if (state.cookies < cost) return;
  state.cookies -= cost;
  state.owned[item.id]++;
  updateUI();
  save();
}

function clickCookie(e) {
  const gain = perClick();
  state.cookies += gain;
  showFloat(e.clientX, e.clientY, '+' + fmt(gain));
  updateUI();
}

function showFloat(x, y, text) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = text;
  el.style.left = (x - 10) + 'px';
  el.style.top = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function updateUI() {
  countEl.textContent = fmt(Math.floor(state.cookies));
  cpsEl.textContent = fmt(perSecond());
  perClickEl.textContent = fmt(perClick());
  ITEMS.forEach(it => {
    const cost = costOf(it);
    document.getElementById('cost-' + it.id).textContent = '🍪 ' + fmt(cost);
    document.getElementById('owned-' + it.id).textContent = state.owned[it.id] || '';
    document.getElementById('item-' + it.id).disabled = state.cookies < cost;
  });
}

// игровой цикл: начисляем печеньки 10 раз в секунду
let last = null;
function loop(timestamp) {
  if (last === null) last = timestamp;
  const dt = (timestamp - last) / 1000;
  last = timestamp;
  state.cookies += perSecond() * dt;
  updateUI();
  requestAnimationFrame(loop);
}

function reset() {
  if (!confirm('Точно сбросить весь прогресс?')) return;
  state = { cookies: 0, owned: {} };
  ITEMS.forEach(it => state.owned[it.id] = 0);
  localStorage.removeItem(SAVE_KEY);
  updateUI();
}

// инициализация
load();
buildShop();
updateUI();
cookieEl.addEventListener('click', clickCookie);
document.getElementById('save').addEventListener('click', () => { save(); alert('Прогресс сохранён!'); });
document.getElementById('reset').addEventListener('click', reset);
// автосохранение каждые 15 секунд
setInterval(save, 15000);
requestAnimationFrame(loop);
</script>

<script>
/* полный экран: кнопка ⛶ и клавиша F (там, где F не занята игрой) */
(function(){
  var btn=document.getElementById("fsBtn"), root=document.documentElement;
  function isFs(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
  function upd(){ if(!btn) return; var on=!!isFs(); btn.textContent=on?"⛶ Выйти":"⛶ Во весь экран"; btn.classList.toggle("on",on); }
  function toggle(){
    try{
      if(!isFs()){ (root.requestFullscreen||root.webkitRequestFullscreen).call(root); }
      else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    }catch(e){}
  }
  if(btn) btn.addEventListener("click",toggle);
  document.addEventListener("fullscreenchange",upd);
  document.addEventListener("webkitfullscreenchange",upd);
  document.addEventListener("keydown",function(e){ if(e.target&&e.target.tagName==="INPUT")return; if(e.code==="KeyF"&&!e.repeat&&!e.ctrlKey&&!e.altKey&&!e.metaKey){ toggle(); } });
  window.__toggleFullscreen=toggle; upd();
})();
</script>
</body>
</html>
