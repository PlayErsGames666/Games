<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крестики-нолики</title>
<style>
  :root {
    --bg: #2b2d42;
    --panel: #3a3d5c;
    --cell: #8d99ae;
    --text: #edf2f4;
    --x: #ef233c;
    --o: #3a86ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
  }
  h1 { margin-bottom: 16px; letter-spacing: 2px; }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button, select {
    background: var(--panel);
    color: var(--text);
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover, select:hover { background: #4a4e73; }
  .status {
    margin-bottom: 16px;
    font-size: 20px;
    font-weight: bold;
    background: var(--panel);
    padding: 10px 22px;
    border-radius: 10px;
    min-width: 240px;
    text-align: center;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 8px;
    background: var(--panel);
    padding: 12px;
    border-radius: 12px;
  }
  .cell {
    width: 100px;
    height: 100px;
    background: var(--cell);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: bold;
    cursor: pointer;
    transition: background .1s, transform .05s;
  }
  .cell:hover:not(.taken) { background: #a2adc0; }
  .cell:active:not(.taken) { transform: scale(0.95); }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.win { background: #06d6a0; color: #fff; }
  .scoreboard {
    display: flex;
    gap: 24px;
    margin-top: 18px;
    font-size: 17px;
    font-weight: bold;
  }
  .scoreboard span { display: inline-flex; align-items: center; gap: 6px; }
  .hint { margin-top: 12px; font-size: 13px; opacity: .6; }
  .stage { display:flex; gap:28px; align-items:flex-start; justify-content:center; flex-wrap:wrap; width:100%; max-width:100%; }
  .game-col { display:flex; flex-direction:column; align-items:center; max-width:100%; min-width:0; }
  .guide-panel {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 16px 18px;
    min-width: 215px;
    max-width: 260px;
    margin-top: 56px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .guide-panel h2 { font-size:14px; letter-spacing:1px; text-transform:uppercase; opacity:.85; margin-bottom:14px; display:flex; align-items:center; gap:7px; }
  .guide-panel .row { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13.5px; }
  .guide-panel .keys { display:flex; gap:4px; flex-shrink:0; }
  .guide-panel .desc { opacity:.85; }
  .guide-panel .sep { height:1px; background:rgba(255,255,255,.09); margin:12px 0; }
  .guide-panel .note { font-size:12px; opacity:.6; margin-top:8px; line-height:1.55; }
  kbd {
    display:inline-block; min-width:22px; text-align:center;
    background:#20223a; border:1px solid rgba(255,255,255,.15);
    border-bottom-width:2px; border-radius:6px; padding:3px 6px;
    font-family:inherit; font-size:12px; font-weight:bold; color:var(--text);
  }
  @media (max-width:760px){ .guide-panel{ margin-top:8px; max-width:100%; width:100%; } }
  @media (max-width:420px){
    body{ padding:12px; } h1{ font-size:22px; }
    #board{ grid-template-columns: repeat(3, 26vw); }
    .cell{ width:26vw; height:26vw; font-size:15vw; }
  }

  /* --- полноэкранный режим: виден ТОЛЬКО игровой экран --- */
  .fsbtn.on { background:#06d6a0; color:#10121f; }
  :fullscreen { background:#07080f; overflow:hidden; }
  :fullscreen body, body:fullscreen { background:#07080f; padding:0; justify-content:center; }
  /* прячем обвязку страницы: заголовок, навигацию, справочник, подсказки.
     .fs-hide ставится скриптом на ряд с кнопкой ⛶ — игровые кнопки остаются */
  :fullscreen h1, :fullscreen .fs-hide, :fullscreen .guide-panel, :fullscreen .hint,
  :fullscreen footer, :fullscreen .sub { display:none !important; }
  :fullscreen .stage { gap:0; align-items:center; justify-content:center; min-height:100vh; }
  :fullscreen .game-col { justify-content:center; }
  /* элементы с этим классом остаются — без них в игру не сыграть */
  :fullscreen .fs-keep { display:flex !important; }
</style>
</head>
<body>
<div class="stage">
<div class="game-col">
  <h1>⭕ КРЕСТИКИ-НОЛИКИ ❌</h1>

  <div class="controls">
    <a href="../../index.html" style="background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;">← Меню</a>
    <button id="fsBtn" class="fsbtn" title="Полный экран (F)">⛶ Во весь экран</button>
    <select id="mode">
      <option value="pvp">2 игрока</option>
      <option value="ai">Против компьютера</option>
    </select>
    <button id="restart">🔄 Новая игра</button>
  </div>

  <div class="status" id="status">Ход: ❌</div>

  <div id="board"></div>

  <div class="scoreboard">
    <span style="color:var(--x)">❌ <span id="scoreX">0</span></span>
    <span>🤝 <span id="scoreD">0</span></span>
    <span style="color:var(--o)">⭕ <span id="scoreO">0</span></span>
  </div>

  <div class="hint">Кликни по клетке, чтобы сделать ход</div>
</div>
<aside class="guide-panel">
  <h2>🎛 Справочник</h2>
  <div class="row"><span class="keys"><kbd>ЛКМ</kbd></span><span class="desc">поставить знак ❌ / ⭕</span></div>
  <div class="sep"></div>
  <div class="row"><span class="desc">Собери 3 в ряд — по горизонтали, вертикали или диагонали.</span></div>
  <div class="note">Управление только мышью. Первым ходит ❌. Компьютер играет идеально.</div>
</aside>
</div>

<script>
const WIN_LINES = [
  [0,1,2],[3,4,5],[6,7,8], // строки
  [0,3,6],[1,4,7],[2,5,8], // столбцы
  [0,4,8],[2,4,6],         // диагонали
];

let board;        // массив из 9 значений: '', 'X', 'O'
let current;      // чей ход: 'X' или 'O'
let over;         // закончена ли партия
let cells = [];   // DOM-элементы
let score = { X: 0, O: 0, D: 0 };

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const modeEl = document.getElementById('mode');

function init() {
  board = ['','','','','','','','',''];
  current = 'X';
  over = false;
  boardEl.innerHTML = '';
  cells = [];
  for (let i = 0; i < 9; i++) {
    const el = document.createElement('div');
    el.className = 'cell';
    el.addEventListener('click', () => onMove(i));
    boardEl.appendChild(el);
    cells.push(el);
  }
  updateStatus();
}

function updateStatus() {
  statusEl.textContent = 'Ход: ' + (current === 'X' ? '❌' : '⭕');
}

function onMove(i) {
  if (over || board[i] !== '') return;
  play(i);
  // ход компьютера
  if (!over && modeEl.value === 'ai' && current === 'O') {
    setTimeout(aiMove, 300);
  }
}

function play(i) {
  board[i] = current;
  cells[i].textContent = current === 'X' ? '❌' : '⭕';
  cells[i].classList.add('taken', current.toLowerCase());

  const line = getWinLine();
  if (line) {
    over = true;
    line.forEach(idx => cells[idx].classList.add('win'));
    statusEl.textContent = (current === 'X' ? '❌' : '⭕') + ' победил!';
    score[current]++;
    updateScore();
    return;
  }
  if (board.every(v => v !== '')) {
    over = true;
    statusEl.textContent = 'Ничья! 🤝';
    score.D++;
    updateScore();
    return;
  }
  current = current === 'X' ? 'O' : 'X';
  updateStatus();
}

function getWinLine() {
  for (const line of WIN_LINES) {
    const [a,b,c] = line;
    if (board[a] && board[a] === board[b] && board[b] === board[c]) return line;
  }
  return null;
}

function updateScore() {
  document.getElementById('scoreX').textContent = score.X;
  document.getElementById('scoreO').textContent = score.O;
  document.getElementById('scoreD').textContent = score.D;
}

// --- Простой непобедимый ИИ (минимакс) ---
function aiMove() {
  if (over) return;
  const best = minimax(board, 'O').index;
  play(best);
}

function minimax(b, player) {
  const empty = b.map((v,i) => v === '' ? i : null).filter(v => v !== null);

  if (winner(b) === 'X') return { score: -10 };
  if (winner(b) === 'O') return { score: 10 };
  if (empty.length === 0) return { score: 0 };

  const moves = [];
  for (const i of empty) {
    const move = { index: i };
    b[i] = player;
    move.score = minimax(b, player === 'O' ? 'X' : 'O').score;
    b[i] = '';
    moves.push(move);
  }

  let best;
  if (player === 'O') {
    let bestScore = -Infinity;
    for (const m of moves) if (m.score > bestScore) { bestScore = m.score; best = m; }
  } else {
    let bestScore = Infinity;
    for (const m of moves) if (m.score < bestScore) { bestScore = m.score; best = m; }
  }
  return best;
}

function winner(b) {
  for (const [a,c,d] of WIN_LINES) {
    if (b[a] && b[a] === b[c] && b[c] === b[d]) return b[a];
  }
  return null;
}

document.getElementById('restart').addEventListener('click', init);
modeEl.addEventListener('change', init);

init();
</script>

<script>
/* полный экран: кнопка ⛶ и клавиша F (там, где F не занята игрой) */
(function(){
  var btn=document.getElementById("fsBtn"), root=document.documentElement;
  function isFs(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
  function upd(){ if(!btn) return; var on=!!isFs(); btn.textContent=on?"⛶ Выйти":"⛶ Во весь экран"; btn.classList.toggle("on",on); }
  function toggle(){
    try{
      if(!isFs()){ (root.requestFullscreen||root.webkitRequestFullscreen).call(root); }
      else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    }catch(e){}
  }
  if(btn){ btn.addEventListener("click",toggle); var nav=btn.closest&&btn.closest(".controls"); if(nav) nav.classList.add("fs-hide"); }
  document.addEventListener("fullscreenchange",upd);
  document.addEventListener("webkitfullscreenchange",upd);
  document.addEventListener("keydown",function(e){ if(e.target&&e.target.tagName==="INPUT")return; if(e.code==="KeyF"&&!e.repeat&&!e.ctrlKey&&!e.altKey&&!e.metaKey){ toggle(); } });
  window.__toggleFullscreen=toggle; upd();
})();
</script>
</body>
</html>
