<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крестики-нолики</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ctext%20x='32'%20y='48'%20font-size='54'%20text-anchor='middle'%3E⭕%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../../shared/net.js?v=20260817-5"></script>
<link rel="stylesheet" href="../../shared/net.css?v=20260817-5">
<link rel="stylesheet" href="../../shared/base.css?v=20260817-5">
<link rel="stylesheet" href="style.css?v=20260817-5">
</head>
<body>
<div class="stage">
<div class="game-col">
  <h1>⭕ КРЕСТИКИ-НОЛИКИ ❌</h1>

  <div class="controls">
    <a href="../../index.html" style="background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;">← Меню</a>
    <button id="fsBtn" class="fsbtn" title="Полный экран (F)">⛶ Во весь экран</button>
    <select id="mode">
      <option value="pvp">2 игрока</option>
      <option value="ai">Против компьютера</option>
    </select>
    <button id="restart">🔄 Новая игра</button>
  </div>

  <div id="netbar" class="fs-hide"></div>

  <div class="status" id="status">Ход: ❌</div>

  <div id="board"></div>

  <div class="scoreboard">
    <span style="color:var(--x)">❌ <span id="scoreX">0</span></span>
    <span>🤝 <span id="scoreD">0</span></span>
    <span style="color:var(--o)">⭕ <span id="scoreO">0</span></span>
  </div>

  <div class="hint">Кликни по клетке, чтобы сделать ход</div>
</div>
<aside class="guide-panel">
  <h2>🎛 Справочник</h2>
  <div class="row"><span class="keys"><kbd>ЛКМ</kbd></span><span class="desc">поставить знак ❌ / ⭕</span></div>
  <div class="sep"></div>
  <div class="row"><span class="desc">Собери 3 в ряд — по горизонтали, вертикали или диагонали.</span></div>
  <div class="note">Управление только мышью. Первым ходит ❌. Компьютер играет идеально.</div>
</aside>
</div>

<script src="game.js?v=20260817-5"></script>

<script src="../../shared/fullscreen.js?v=20260817-5"></script>
</body>
</html>
