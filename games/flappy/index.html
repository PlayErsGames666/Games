<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy</title>
<style>
  :root {
    --bg: #2b2d42;
    --panel: #3a3d5c;
    --panel2: #4a4e73;
    --text: #edf2f4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
  }
  h1 { margin-bottom: 14px; letter-spacing: 3px; }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .controls button {
    background: var(--panel);
    color: var(--text);
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s;
  }
  .controls button:hover { background: var(--panel2); }
  .status {
    display: flex;
    gap: 24px;
    margin-bottom: 14px;
    font-size: 20px;
    font-weight: bold;
    background: var(--panel);
    padding: 10px 20px;
    border-radius: 10px;
  }
  .status span { display: inline-flex; align-items: center; gap: 6px; }
  canvas {
    border-radius: 12px;
    display: block;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    cursor: pointer;
    touch-action: none;
    max-width: 100%;
    height: auto;
  }
  .hint { margin-top: 12px; font-size: 13px; opacity: .6; text-align: center; }
  .stage { display:flex; gap:28px; align-items:flex-start; justify-content:center; flex-wrap:wrap; width:100%; max-width:100%; }
  .game-col { display:flex; flex-direction:column; align-items:center; max-width:100%; min-width:0; }
  .guide-panel {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 16px 18px;
    min-width: 215px;
    max-width: 260px;
    margin-top: 56px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .guide-panel h2 { font-size:14px; letter-spacing:1px; text-transform:uppercase; opacity:.85; margin-bottom:14px; display:flex; align-items:center; gap:7px; }
  .guide-panel .row { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13.5px; }
  .guide-panel .keys { display:flex; gap:4px; flex-shrink:0; }
  .guide-panel .desc { opacity:.85; }
  .guide-panel .sep { height:1px; background:rgba(255,255,255,.09); margin:12px 0; }
  .guide-panel .note { font-size:12px; opacity:.6; margin-top:8px; line-height:1.55; }
  kbd {
    display:inline-block; min-width:22px; text-align:center;
    background:#20223a; border:1px solid rgba(255,255,255,.15);
    border-bottom-width:2px; border-radius:6px; padding:3px 6px;
    font-family:inherit; font-size:12px; font-weight:bold; color:var(--text);
  }
  @media (max-width:760px){ .guide-panel{ margin-top:8px; max-width:100%; width:100%; } }
  @media (max-width:480px){ body{ padding:12px; } h1{ font-size:24px; } }

  /* --- полноэкранный режим: виден ТОЛЬКО игровой экран --- */
  .fsbtn.on { background:#06d6a0; color:#10121f; }
  :fullscreen { background:#07080f; overflow:hidden; }
  :fullscreen body, body:fullscreen { background:#07080f; padding:0; justify-content:center; }
  /* прячем обвязку страницы: заголовок, навигацию, справочник, подсказки.
     .fs-hide ставится скриптом на ряд с кнопкой ⛶ — игровые кнопки остаются */
  :fullscreen h1, :fullscreen .fs-hide, :fullscreen .guide-panel, :fullscreen .hint,
  :fullscreen footer, :fullscreen .sub { display:none !important; }
  :fullscreen .stage { gap:0; align-items:center; justify-content:center; min-height:100vh; }
  :fullscreen .game-col { justify-content:center; }
  /* растянутый канвас не должен размываться интерполяцией */
  :fullscreen canvas { image-rendering:pixelated; max-width:none; }
  /* на компьютере (мышь) экранный D-pad и дублирующие кнопки не нужны —
     без них игра занимает почти весь экран; на тачскрине они остаются */
  @media (hover:hover) and (pointer:fine){
    :fullscreen .pad, :fullscreen .fs-touch { display:none !important; }
  }
</style>
</head>
<body>
<div class="stage">
<div class="game-col">
  <h1>🐤 FLAPPY</h1>

  <div class="controls">
    <a href="../../index.html" style="background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;">← Меню</a>
    <button id="fsBtn" class="fsbtn" title="Полный экран (F)">⛶ Во весь экран</button>
    <button id="pause">⏸ Пауза</button>
    <button id="restart">🔄 Заново</button>
  </div>

  <div class="status">
    <span>⭐ <span id="score">0</span></span>
    <span>🏆 <span id="best">0</span></span>
  </div>

  <canvas id="game" width="420" height="600"></canvas>

  <div class="hint">Клик, Пробел или ↑ — взмах · P / Esc — пауза · пролетай между трубами</div>
</div>
<aside class="guide-panel">
  <h2>🎛 Справочник</h2>
  <div class="row"><span class="keys"><kbd>Space</kbd></span><span class="desc">взмах / взлёт</span></div>
  <div class="row"><span class="keys"><kbd>↑</kbd></span><span class="desc">взмах</span></div>
  <div class="row"><span class="keys"><kbd>ЛКМ</kbd></span><span class="desc">взмах</span></div>
  <div class="row"><span class="keys"><kbd>P</kbd><kbd>Esc</kbd></span><span class="desc">пауза / продолжить</span></div>
  <div class="sep"></div>
  <div class="note">Пролетай между трубами. Пауза работает только во время игры.</div>
</aside>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// --- параметры игры ---
const GRAVITY = 1400;      // ускорение падения (px/сек²)
const FLAP = -420;         // скорость взмаха (px/сек)
const PIPE_W = 64;         // ширина трубы
const GAP = 160;           // просвет между трубами
const PIPE_SPACING = 220;  // расстояние между парами труб по горизонтали
const SPEED = 150;         // скорость движения мира (px/сек)
const GROUND = 90;         // высота земли снизу
const BIRD_R = 16;         // радиус птицы

const STATE = { READY: 0, PLAY: 1, OVER: 2 };

let bird;        // {y, vy, rot}
let pipes;       // [{x, gapY, passed}]
let score, best;
let state;
let paused;
let lastFrame;

best = parseInt(localStorage.getItem('flappyBest') || '0', 10);

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const pauseBtn = document.getElementById('pause');
const restartBtn = document.getElementById('restart');
bestEl.textContent = best;

function resetGame() {
  bird = { y: H * 0.42, vy: 0, rot: 0 };
  pipes = [];
  score = 0;
  scoreEl.textContent = 0;
  state = STATE.READY;
  paused = false;
  updatePauseBtn();
}

function togglePause() {
  // пауза имеет смысл только во время игры
  if (state !== STATE.PLAY) return;
  paused = !paused;
  updatePauseBtn();
}

function updatePauseBtn() {
  pauseBtn.textContent = paused ? '▶ Продолжить' : '⏸ Пауза';
}

function flap() {
  if (paused) return; // во время паузы взмах игнорируем
  if (state === STATE.READY) {
    state = STATE.PLAY;
    bird.vy = FLAP;
  } else if (state === STATE.PLAY) {
    bird.vy = FLAP;
  } else if (state === STATE.OVER) {
    resetGame();
  }
}

function spawnPipe() {
  const margin = 60;
  const gapY = margin + Math.random() * (H - GROUND - GAP - margin * 2);
  const last = pipes[pipes.length - 1];
  const x = last ? last.x + PIPE_SPACING : W + 40;
  pipes.push({ x, gapY, passed: false });
}

function update(dt) {
  if (paused) return; // на паузе мир застыл
  if (state === STATE.PLAY) {
    // физика птицы
    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    // наклон птицы по скорости
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy / 600));

    // движение труб
    for (const p of pipes) p.x -= SPEED * dt;

    // рождение новых труб (по позиции последней)
    if (pipes.length === 0 || pipes[pipes.length - 1].x <= W - PIPE_SPACING) {
      spawnPipe();
    }
    // удаление ушедших за экран
    if (pipes.length && pipes[0].x + PIPE_W < -10) pipes.shift();

    // счёт: труба пройдена
    for (const p of pipes) {
      if (!p.passed && p.x + PIPE_W < W * 0.3 - BIRD_R) {
        p.passed = true;
        score++;
        scoreEl.textContent = score;
      }
    }

    checkCollision();
  } else if (state === STATE.READY) {
    // лёгкое «парение» до старта
    bird.y = H * 0.42 + Math.sin(performance.now() / 300) * 8;
  } else if (state === STATE.OVER) {
    // птица падает на землю
    if (bird.y < H - GROUND - BIRD_R) {
      bird.vy += GRAVITY * dt;
      bird.y += bird.vy * dt;
      bird.rot = Math.min(1.5, bird.rot + dt * 3);
    } else {
      bird.y = H - GROUND - BIRD_R;
    }
  }
}

function checkCollision() {
  const bx = W * 0.3;
  // земля и потолок
  if (bird.y + BIRD_R >= H - GROUND || bird.y - BIRD_R <= 0) {
    return gameOver();
  }
  // трубы
  for (const p of pipes) {
    if (bx + BIRD_R > p.x && bx - BIRD_R < p.x + PIPE_W) {
      if (bird.y - BIRD_R < p.gapY || bird.y + BIRD_R > p.gapY + GAP) {
        return gameOver();
      }
    }
  }
}

function gameOver() {
  if (state !== STATE.PLAY) return;
  state = STATE.OVER;
  if (score > best) {
    best = score;
    localStorage.setItem('flappyBest', String(best));
    bestEl.textContent = best;
  }
}

// --- отрисовка ---
function draw() {
  // небо (градиент)
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#1d3b53');
  sky.addColorStop(1, '#3a6ea5');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // трубы
  for (const p of pipes) drawPipe(p);

  // земля
  ctx.fillStyle = '#c9a227';
  ctx.fillRect(0, H - GROUND, W, GROUND);
  ctx.fillStyle = '#8f6f1f';
  ctx.fillRect(0, H - GROUND, W, 8);
  // травка-полосы
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let x = 0; x < W; x += 24) ctx.fillRect(x, H - GROUND + 8, 12, GROUND - 8);

  // птица
  drawBird();

  // счёт крупно во время игры
  if (state === STATE.PLAY || state === STATE.READY) {
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.font = 'bold 46px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(score, W / 2, 70);
  }

  if (state === STATE.READY) {
    banner('Готов?', 'Клик / Пробел — взлёт');
  }
  if (state === STATE.OVER) {
    banner('💀 Готово', 'Счёт: ' + score + ' · клик — заново');
  }
  if (paused && state === STATE.PLAY) {
    banner('⏸ ПАУЗА', 'P / Esc или кнопка — продолжить');
  }
}

function drawPipe(p) {
  const grad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  grad.addColorStop(0, '#3ba55d');
  grad.addColorStop(0.5, '#57cc7a');
  grad.addColorStop(1, '#2e8049');
  ctx.fillStyle = grad;
  // верхняя труба
  ctx.fillRect(p.x, 0, PIPE_W, p.gapY);
  // нижняя труба
  ctx.fillRect(p.x, p.gapY + GAP, PIPE_W, H - GROUND - (p.gapY + GAP));
  // «шляпки» труб
  ctx.fillStyle = '#2e8049';
  ctx.fillRect(p.x - 4, p.gapY - 18, PIPE_W + 8, 18);
  ctx.fillRect(p.x - 4, p.gapY + GAP, PIPE_W + 8, 18);
}

function drawBird() {
  const bx = W * 0.3;
  ctx.save();
  ctx.translate(bx, bird.y);
  ctx.rotate(bird.rot);

  // тело
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
  ctx.fill();
  // крыло
  ctx.fillStyle = '#f4a300';
  ctx.beginPath();
  ctx.ellipse(-3, 3, 9, 6, -0.3, 0, Math.PI * 2);
  ctx.fill();
  // клюв
  ctx.fillStyle = '#ef233c';
  ctx.beginPath();
  ctx.moveTo(BIRD_R - 2, -2);
  ctx.lineTo(BIRD_R + 9, 2);
  ctx.lineTo(BIRD_R - 2, 6);
  ctx.closePath();
  ctx.fill();
  // глаз
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(6, -6, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1d1e30';
  ctx.beginPath();
  ctx.arc(8, -6, 2.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function banner(title, subtitle) {
  ctx.fillStyle = 'rgba(29,30,48,.62)';
  ctx.fillRect(0, H / 2 - 70, W, 140);
  ctx.fillStyle = '#edf2f4';
  ctx.textAlign = 'center';
  ctx.font = 'bold 40px Segoe UI, sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 8);
  ctx.font = '18px Segoe UI, sans-serif';
  ctx.fillStyle = 'rgba(237,242,244,.8)';
  ctx.fillText(subtitle, W / 2, H / 2 + 28);
}

// --- главный цикл (60 FPS) ---
function frame(now) {
  if (lastFrame === null) lastFrame = now;
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (dt > 0.05) dt = 0.05; // защита от рывка после сворачивания вкладки
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

// --- управление ---
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.code === 'Space' || e.key === 'ArrowUp') {
    e.preventDefault();
    flap();
  } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape' ||
             e.key === 'з' || e.key === 'З') { // з — та же клавиша в рус. раскладке
    e.preventDefault();
    togglePause();
  }
});

pauseBtn.addEventListener('click', togglePause);
restartBtn.addEventListener('click', resetGame);

resetGame();
lastFrame = null;
requestAnimationFrame(frame);
</script>

<script>
/* полный экран: кнопка ⛶ и клавиша F (там, где F не занята игрой) */
(function(){
  var btn=document.getElementById("fsBtn"), root=document.documentElement;
  function isFs(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
  /* в полный экран растягиваем игровой блок под размер экрана, сохраняя пропорции.
     transform не меняет вёрстку, а getBoundingClientRect отдаёт УЖЕ масштабированный
     прямоугольник — поэтому попадания мыши/тача остаются точными */
  var CV=document.querySelector(".game-col canvas");     // логический размер — ДО любых правок
  if(CV){ CV.__logW=CV.width; CV.__logH=CV.height; }
  function fit(){
    var col=document.querySelector(".game-col"); if(!col) return;
    col.style.transform=""; col.style.transformOrigin="";
    if(CV){ CV.style.width=""; CV.style.height=""; }
    if(!isFs()) return;
    if(CV){
      /* канвас растягиваем ЕГО СОБСТВЕННЫМ css-размером, а не transform колонки:
         так композитор не размывает картинку, а игра может отрисоваться
         в реальном разрешении экрана */
      var lw=CV.__logW, lh=CV.__logH;
      var extra=col.getBoundingClientRect().height - CV.getBoundingClientRect().height;
      var availH=Math.max(140, window.innerHeight-extra-10), availW=window.innerWidth-10;
      var k=Math.min(availW/lw, availH/lh);
      if(k>1.01){ CV.style.width=Math.round(lw*k)+"px"; CV.style.height=Math.round(lh*k)+"px"; }
      return;
    }
    var r=col.getBoundingClientRect(), w=r.width, h=r.height;
    if(!w||!h) return;
    var k2=Math.min(window.innerWidth/w, window.innerHeight/h)*0.98;
    if(k2>1.01){ col.style.transformOrigin="center center"; col.style.transform="scale("+k2.toFixed(3)+")"; }
  }
  function upd(){ if(btn){ var on=!!isFs(); btn.textContent=on?"⛶ Выйти":"⛶ Во весь экран"; btn.classList.toggle("on",on); } requestAnimationFrame(fit); }
  function toggle(){
    try{
      if(!isFs()){ (root.requestFullscreen||root.webkitRequestFullscreen).call(root); }
      else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    }catch(e){}
  }
  if(btn){ btn.addEventListener("click",toggle); var nav=btn.closest&&btn.closest(".controls"); if(nav) nav.classList.add("fs-hide"); }
  document.addEventListener("fullscreenchange",upd);
  document.addEventListener("webkitfullscreenchange",upd);
  window.addEventListener("resize",function(){ if(isFs()) requestAnimationFrame(fit); });
  document.addEventListener("keydown",function(e){ if(e.target&&e.target.tagName==="INPUT")return; if(e.code==="KeyF"&&!e.repeat&&!e.ctrlKey&&!e.altKey&&!e.metaKey){ toggle(); } });
  window.__toggleFullscreen=toggle; window.__fsFit=fit; upd();
})();
</script>
</body>
</html>
