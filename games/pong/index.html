<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../../shared/net.js"></script>
<link rel="stylesheet" href="../../shared/net.css">
<style>
  :root {
    --bg: #2b2d42;
    --panel: #3a3d5c;
    --text: #edf2f4;
    --accent: #06d6a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
  }
  h1 { margin-bottom: 14px; letter-spacing: 3px; }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button, select {
    background: var(--panel);
    color: var(--text);
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover, select:hover { background: #4a4e73; }
  canvas {
    background: #1d1e30;
    border-radius: 10px;
    display: block;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    touch-action: none;
    max-width: 100%;
    height: auto;
  }
  .hint { margin-top: 12px; font-size: 13px; opacity: .6; text-align: center; }
  .stage { display:flex; gap:28px; align-items:flex-start; justify-content:center; flex-wrap:wrap; width:100%; max-width:100%; }
  .game-col { display:flex; flex-direction:column; align-items:center; max-width:100%; min-width:0; }
  .guide-panel {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 16px 18px;
    min-width: 215px;
    max-width: 260px;
    margin-top: 56px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .guide-panel h2 { font-size:14px; letter-spacing:1px; text-transform:uppercase; opacity:.85; margin-bottom:14px; display:flex; align-items:center; gap:7px; }
  .guide-panel .row { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13.5px; }
  .guide-panel .keys { display:flex; gap:4px; flex-shrink:0; }
  .guide-panel .desc { opacity:.85; }
  .guide-panel .sep { height:1px; background:rgba(255,255,255,.09); margin:12px 0; }
  .guide-panel .note { font-size:12px; opacity:.6; margin-top:8px; line-height:1.55; }
  kbd {
    display:inline-block; min-width:22px; text-align:center;
    background:#20223a; border:1px solid rgba(255,255,255,.15);
    border-bottom-width:2px; border-radius:6px; padding:3px 6px;
    font-family:inherit; font-size:12px; font-weight:bold; color:var(--text);
  }
  @media (max-width:760px){ .guide-panel{ margin-top:8px; max-width:100%; width:100%; } }
  @media (max-width:480px){ body{ padding:12px; } h1{ font-size:24px; } }

  /* --- полноэкранный режим: виден ТОЛЬКО игровой экран --- */
  .fsbtn.on { background:#06d6a0; color:#10121f; }
  :fullscreen { background:#07080f; overflow:hidden; }
  :fullscreen body, body:fullscreen { background:#07080f; padding:0; justify-content:center; }
  /* прячем обвязку страницы: заголовок, навигацию, справочник, подсказки.
     .fs-hide ставится скриптом на ряд с кнопкой ⛶ — игровые кнопки остаются */
  :fullscreen h1, :fullscreen .fs-hide, :fullscreen .guide-panel, :fullscreen .hint,
  :fullscreen footer, :fullscreen .sub { display:none !important; }
  :fullscreen .stage { gap:0; align-items:center; justify-content:center; min-height:100vh; }
  :fullscreen .game-col { justify-content:center; }
  /* растянутый канвас не должен размываться интерполяцией */
  :fullscreen canvas { image-rendering:pixelated; max-width:none; }
  /* на компьютере (мышь) экранный D-pad и дублирующие кнопки не нужны —
     без них игра занимает почти весь экран; на тачскрине они остаются */
  @media (hover:hover) and (pointer:fine){
    :fullscreen .pad, :fullscreen .fs-touch { display:none !important; }
  }
</style>
</head>
<body>
<div class="stage">
<div class="game-col">
  <h1>🏓 PONG</h1>

  <div class="controls">
    <a href="../../index.html" style="background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;">← Меню</a>
    <button id="fsBtn" class="fsbtn" title="Полный экран (F)">⛶ Во весь экран</button>
    <select id="difficulty">
      <option value="0.06">Легко</option>
      <option value="0.09" selected>Средне</option>
      <option value="0.14">Сложно</option>
    </select>
    <button id="restart">🔄 Заново</button>
  </div>

  <div id="netbar" class="fs-hide"></div>

  <canvas id="game" width="700" height="440"></canvas>

  <div class="hint">Ракетка: мышь, стрелки ↑ ↓ или W / S · Пробел — пауза · играем до 7 очков · онлайн: хост слева, гость справа</div>
</div>
<aside class="guide-panel">
  <h2>🎛 Справочник</h2>
  <div class="row"><span class="keys"><kbd>↑</kbd><kbd>↓</kbd></span><span class="desc">ракетка вверх / вниз</span></div>
  <div class="row"><span class="keys"><kbd>W</kbd><kbd>S</kbd></span><span class="desc">ракетка вверх / вниз</span></div>
  <div class="row"><span class="keys"><kbd>Мышь</kbd></span><span class="desc">ракетка за курсором</span></div>
  <div class="row"><span class="keys"><kbd>Space</kbd></span><span class="desc">пауза / продолжить</span></div>
  <div class="sep"></div>
  <div class="note">Играем до 7 очков. Мяч разгоняется с каждым ударом.</div>
</aside>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const PADDLE_W = 12, PADDLE_H = 80, PADDLE_MARGIN = 20;
const BALL_R = 8;
const WIN_SCORE = 7;

const START_SPEED = 3.2;   // медленная начальная скорость мяча
const MAX_SPEED   = 11;    // потолок скорости
const SPEEDUP     = 1.035; // насколько ускоряется мяч за каждый удар ракеткой
const SERVE_FRAMES = 180;  // пауза-отсчёт перед подачей (~3 сек при 60 к/с)

let player, ai, ball;
let scoreP, scoreAI;
let aiSpeed;          // «реакция» компьютера (0..1) — выбирается сложностью
let running, gameOver, winSide;
let remoteY = null, netAcc = 0;    // ракетка гостя и счётчик рассылки
let paused;           // пауза по пробелу
let serveTimer;       // >0 — мяч ждёт подачи в центре, идёт обратный отсчёт
let shake;            // сила тряски экрана после удара
let trail;            // след за мячом (последние позиции)

function reset() {
  aiSpeed = parseFloat(document.getElementById('difficulty').value);
  scoreP = 0; scoreAI = 0;
  gameOver = false; winSide = null; running = true;
  paused = false;
  shake = 0;
  trail = [];
  remoteY = null; netAcc = 0;
  player = { y: H / 2 - PADDLE_H / 2, flash: 0 };
  ai = { y: H / 2 - PADDLE_H / 2, flash: 0 };
  resetBall(Math.random() < 0.5 ? 1 : -1);
  if (isNet() && net.isHost()) broadcast();
}

function resetBall(dir) {
  // dir: 1 — к компьютеру (вправо), -1 — к игроку (влево)
  const angle = (Math.random() * 0.5 - 0.25); // небольшой разброс по вертикали
  ball = {
    x: W / 2,
    y: H / 2,
    vx: dir * START_SPEED * Math.cos(angle),
    vy: START_SPEED * Math.sin(angle),
    dir: dir,
  };
  trail = [];
  serveTimer = SERVE_FRAMES; // мяч замирает в центре и ждёт отсчёта
}

/* Онлайн: хост играет ЛЕВОЙ ракеткой, гость — правой (той, что офлайн
   занимает компьютер). Поэтому «моя ракетка» — не всегда player. */
function isNet() { return net && net.isOnline(); }
function iAmLeft() { return !isNet() || net.isHost(); }
function myPad() { return iAmLeft() ? player : ai; }

// --- управление игрока ---
let mouseControl = false;
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const y = (e.clientY - rect.top) * (H / rect.height);
  myPad().y = y - PADDLE_H / 2;
  mouseControl = true;
});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const y = (e.touches[0].clientY - rect.top) * (H / rect.height);
  myPad().y = y - PADDLE_H / 2;
}, { passive: false });

const keys = {};
document.addEventListener('keydown', (e) => {
  if (['ArrowUp','ArrowDown','w','s','W','S'].includes(e.key)) { keys[e.key] = true; mouseControl = false; e.preventDefault(); }
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (gameOver) return;
    // онлайн паузу держит хост, иначе экраны разъедутся; гость просит
    if (isNet() && !net.isHost()) { net.send({ t: 'pause' }); return; }
    paused = !paused; syncNow();
  }
});
document.addEventListener('keyup', (e) => { keys[e.key] = false; });

function movePlayerByKeys() {
  const step = 7, p = myPad();
  if (keys['ArrowUp'] || keys['w'] || keys['W']) p.y -= step;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) p.y += step;
}

function clampPaddles() {
  player.y = Math.max(0, Math.min(H - PADDLE_H, player.y));
  ai.y = Math.max(0, Math.min(H - PADDLE_H, ai.y));
}

function update() {
  if (!running || paused) return;

  // затухание эффектов
  if (shake > 0) shake *= 0.85;
  if (player.flash > 0) player.flash -= 0.06;
  if (ai.flash > 0) ai.flash -= 0.06;

  if (!mouseControl) movePlayerByKeys();

  if (isNet()) {
    clampPaddles();
    if (net.isHost()) {
      if (remoteY != null) ai.y = remoteY;      // правая ракетка — это гость
      clampPaddles();
      physics();
      // 30 пакетов в секунду: мяч летит плавно, а канал не забит
      if (++netAcc >= 2) { netAcc = 0; broadcast(); }
    } else {
      // гость физику не считает: он рисует присланное и шлёт свою ракетку
      if (++netAcc >= 2) { netAcc = 0; net.send({ t: 'p', y: ai.y }); }
      if (serveTimer > 0) serveTimer--;
      else { trail.push({ x: ball.x, y: ball.y }); if (trail.length > 14) trail.shift(); }
    }
    return;
  }

  // компьютер следит за мячом с ограниченной скоростью
  const aiCenter = ai.y + PADDLE_H / 2;
  ai.y += (ball.y - aiCenter) * aiSpeed;
  clampPaddles();
  physics();
}

function physics() {
  // пауза-подача: мяч стоит в центре, идёт обратный отсчёт
  if (serveTimer > 0) {
    serveTimer--;
    return;
  }

  // след за мячом
  trail.push({ x: ball.x, y: ball.y });
  if (trail.length > 14) trail.shift();

  // движение мяча
  ball.x += ball.vx;
  ball.y += ball.vy;

  // отскок от верха/низа
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy *= -1; }
  if (ball.y + BALL_R > H) { ball.y = H - BALL_R; ball.vy *= -1; }

  // ракетка игрока (слева)
  if (ball.vx < 0 &&
      ball.x - BALL_R < PADDLE_MARGIN + PADDLE_W &&
      ball.x - BALL_R > PADDLE_MARGIN - 6 &&
      ball.y > player.y && ball.y < player.y + PADDLE_H) {
    bounce(player);
    ball.x = PADDLE_MARGIN + PADDLE_W + BALL_R;
  }

  // ракетка компьютера (справа)
  if (ball.vx > 0 &&
      ball.x + BALL_R > W - PADDLE_MARGIN - PADDLE_W &&
      ball.x + BALL_R < W - PADDLE_MARGIN + 6 &&
      ball.y > ai.y && ball.y < ai.y + PADDLE_H) {
    bounce(ai);
    ball.x = W - PADDLE_MARGIN - PADDLE_W - BALL_R;
  }

  // гол
  if (ball.x < 0) { scoreAI++; afterGoal(1); }
  else if (ball.x > W) { scoreP++; afterGoal(-1); }
}

function bounce(paddle) {
  // угол отскока зависит от точки удара по ракетке
  const rel = (ball.y - (paddle.y + PADDLE_H / 2)) / (PADDLE_H / 2); // -1..1
  const speed = Math.min(Math.hypot(ball.vx, ball.vy) * SPEEDUP, MAX_SPEED); // чуть ускоряем
  const dir = ball.vx < 0 ? 1 : -1;
  const maxAngle = Math.PI / 3.2;
  const angle = rel * maxAngle;
  ball.vx = dir * speed * Math.cos(angle);
  ball.vy = speed * Math.sin(angle);

  // импакт: вспышка ракетки + тряска экрана
  paddle.flash = 1;
  shake = 8;
  trail = [];
}

function afterGoal(dir) {
  if (scoreP >= WIN_SCORE || scoreAI >= WIN_SCORE) {
    running = false;
    gameOver = true;
    winSide = scoreP >= WIN_SCORE ? 0 : 1;      // 0 — левый, 1 — правый
  } else {
    resetBall(dir);
  }
  syncNow();
}
/* Пакеты идут только пока идёт игра. Значит про КОНЕЦ матча и про паузу
   надо сообщить отдельно — иначе у гостя навсегда остался бы счёт 6:4
   и живой мяч, хотя у хоста уже экран победы. */
function syncNow() { if (isNet() && net.isHost()) broadcast(); }
// текст победы каждый считает про себя: онлайн у соперника он зеркальный
function winnerText() {
  if (winSide == null) return '';
  const iWon = winSide === (iAmLeft() ? 0 : 1);
  if (!isNet()) return winSide === 0 ? 'Ты победил! 🎉' : 'Победил компьютер 🤖';
  return iWon ? 'Ты победил! 🎉' : 'Победил соперник 😔';
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  // тряска экрана после удара
  if (shake > 0.3) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  // центральная пунктирная линия
  ctx.strokeStyle = 'rgba(237,242,244,.25)';
  ctx.lineWidth = 3;
  ctx.setLineDash([10, 14]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // счёт
  ctx.fillStyle = 'rgba(237,242,244,.85)';
  ctx.font = 'bold 48px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(scoreP, W / 2 - 60, 60);
  ctx.fillText(scoreAI, W / 2 + 60, 60);

  // ракетки (со вспышкой при ударе)
  drawPaddle(PADDLE_MARGIN, player.y, '#06d6a0', player.flash);
  drawPaddle(W - PADDLE_MARGIN - PADDLE_W, ai.y, '#ef233c', ai.flash);

  // след за мячом
  for (let i = 0; i < trail.length; i++) {
    const t = trail[i];
    const k = (i + 1) / trail.length;
    ctx.globalAlpha = k * 0.5;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.arc(t.x, t.y, BALL_R * k, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // мяч (с мягким свечением)
  ctx.shadowColor = '#ffd166';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // обратный отсчёт перед подачей
  if (serveTimer > 0) {
    const n = Math.ceil(serveTimer / 60); // 3 → 2 → 1 (по секунде каждый)
    ctx.fillStyle = 'rgba(237,242,244,.9)';
    ctx.font = 'bold 64px Segoe UI, sans-serif';
    ctx.fillText(n, W / 2, H / 2 + 22);
    ctx.font = '16px Segoe UI, sans-serif';
    ctx.fillStyle = 'rgba(237,242,244,.6)';
    ctx.fillText(ball.dir < 0 ? '◄ подача к тебе' : 'подача к сопернику ►', W / 2, H - 40);
  }

  ctx.restore();

  // экран паузы
  if (paused && !gameOver) {
    ctx.fillStyle = 'rgba(29,30,48,.75)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#edf2f4';
    ctx.font = 'bold 44px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⏸ ПАУЗА', W / 2, H / 2 - 6);
    ctx.font = '18px Segoe UI, sans-serif';
    ctx.fillStyle = 'rgba(237,242,244,.7)';
    ctx.fillText('Пробел — продолжить', W / 2, H / 2 + 30);
  }

  // финальный экран
  if (gameOver) {
    ctx.fillStyle = 'rgba(29,30,48,.8)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#edf2f4';
    ctx.font = 'bold 40px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(winnerText(), W / 2, H / 2 - 10);
    ctx.font = '18px Segoe UI, sans-serif';
    ctx.fillText('Нажми «Заново», чтобы сыграть ещё', W / 2, H / 2 + 30);
  }
}

function drawPaddle(x, y, color, flash) {
  // базовая ракетка (со свечением в момент удара)
  if (flash > 0) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 30 * flash;
  }
  ctx.fillStyle = color;
  ctx.fillRect(x, y, PADDLE_W, PADDLE_H);
  ctx.shadowBlur = 0;
  // белая вспышка поверх, затухает
  if (flash > 0) {
    ctx.globalAlpha = flash;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x, y, PADDLE_W, PADDLE_H);
    ctx.globalAlpha = 1;
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('restart').addEventListener('click', () => {
  if (isNet() && !net.isHost()) { net.send({ t: 'new' }); return; }   // онлайн партию перезапускает хост
  reset();
});
document.getElementById('difficulty').addEventListener('change', () => { if (!isNet()) reset(); });

/* =====================  ОНЛАЙН  =====================
   Хост считает мяч и рассылает состояние 30 раз в секунду. Гость шлёт
   только Y своей ракетки и рисует присланное — но СВОЮ ракетку рисует
   по-своему, не дожидаясь ответа, иначе она заметно тормозит за курсором. */
function broadcast() {
  net.send({
    t: 's', bx: ball.x, by: ball.y, vx: ball.vx, vy: ball.vy, bd: ball.dir,
    py: player.y, sp: scoreP, sa: scoreAI, st: serveTimer,
    go: gameOver, ws: winSide, run: running, pa: paused
  });
}

const net = NET.create({
  prefix: 'pong', max: 2,
  onOpen: () => { document.getElementById('difficulty').disabled = true; reset(); },
  onJoin: () => { reset(); },
  onLeave: () => { remoteY = null; paused = true; },        // соперник вышел — мяч замирает
  onWelcome: () => { document.getElementById('difficulty').disabled = true; },
  onClose: () => { paused = true; },
  onData: (m) => {
    if (net.isHost()) {
      if (m.t === 'p') remoteY = m.y;
      else if (m.t === 'new') reset();
      else if (m.t === 'pause') { if (!gameOver) { paused = !paused; syncNow(); } }
      return;
    }
    if (m.t !== 's') return;
    ball.x = m.bx; ball.y = m.by; ball.vx = m.vx; ball.vy = m.vy; ball.dir = m.bd;
    player.y = m.py;                       // левая ракетка — хостовая
    scoreP = m.sp; scoreAI = m.sa; serveTimer = m.st;
    gameOver = m.go; winSide = m.ws; running = m.run; paused = m.pa;
  }
});
NET.lobby(document.getElementById('netbar'), net);

reset();
loop();
</script>

<script>
/* полный экран: кнопка ⛶ и клавиша F (там, где F не занята игрой) */
(function(){
  var btn=document.getElementById("fsBtn"), root=document.documentElement;
  function isFs(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
  /* в полный экран растягиваем игровой блок под размер экрана, сохраняя пропорции.
     transform не меняет вёрстку, а getBoundingClientRect отдаёт УЖЕ масштабированный
     прямоугольник — поэтому попадания мыши/тача остаются точными */
  var CV=document.querySelector(".game-col canvas");     // логический размер — ДО любых правок
  if(CV){ CV.__logW=CV.width; CV.__logH=CV.height; }
  function fit(){
    var col=document.querySelector(".game-col"); if(!col) return;
    col.style.transform=""; col.style.transformOrigin="";
    if(CV){ CV.style.width=""; CV.style.height=""; }
    if(!isFs()) return;
    if(CV){
      /* канвас растягиваем ЕГО СОБСТВЕННЫМ css-размером, а не transform колонки:
         так композитор не размывает картинку, а игра может отрисоваться
         в реальном разрешении экрана */
      var lw=CV.__logW, lh=CV.__logH;
      var extra=col.getBoundingClientRect().height - CV.getBoundingClientRect().height;
      var availH=Math.max(140, window.innerHeight-extra-10), availW=window.innerWidth-10;
      var k=Math.min(availW/lw, availH/lh);
      if(k>1.01){ CV.style.width=Math.round(lw*k)+"px"; CV.style.height=Math.round(lh*k)+"px"; }
      return;
    }
    var r=col.getBoundingClientRect(), w=r.width, h=r.height;
    if(!w||!h) return;
    var k2=Math.min(window.innerWidth/w, window.innerHeight/h)*0.98;
    if(k2>1.01){ col.style.transformOrigin="center center"; col.style.transform="scale("+k2.toFixed(3)+")"; }
  }
  function upd(){ if(btn){ var on=!!isFs(); btn.textContent=on?"⛶ Выйти":"⛶ Во весь экран"; btn.classList.toggle("on",on); } requestAnimationFrame(fit); }
  function toggle(){
    try{
      if(!isFs()){ (root.requestFullscreen||root.webkitRequestFullscreen).call(root); }
      else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    }catch(e){}
  }
  if(btn){ btn.addEventListener("click",toggle); var nav=btn.closest&&btn.closest(".controls"); if(nav) nav.classList.add("fs-hide"); }
  document.addEventListener("fullscreenchange",upd);
  document.addEventListener("webkitfullscreenchange",upd);
  window.addEventListener("resize",function(){ if(isFs()) requestAnimationFrame(fit); });
  document.addEventListener("keydown",function(e){ if(e.target&&e.target.tagName==="INPUT")return; if(e.code==="KeyF"&&!e.repeat&&!e.ctrlKey&&!e.altKey&&!e.metaKey){ toggle(); } });
  window.__toggleFullscreen=toggle; window.__fsFit=fit; upd();
})();
</script>
</body>
</html>
