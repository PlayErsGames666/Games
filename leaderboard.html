<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таблица рекордов</title>
<style>
  :root { --bg:#1b1d2e; --panel:#2b2d42; --panel2:#3a3d5c; --text:#edf2f4; --accent:#06d6a0; --gold:#ffd166; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',Tahoma,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:24px 16px 60px; }
  .wrap { max-width:980px; margin:0 auto; }
  h1 { text-align:center; letter-spacing:2px; margin-bottom:6px; }
  .sub { text-align:center; opacity:.6; font-size:14px; margin-bottom:20px; }

  .bar { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; margin-bottom:16px; }
  button, a.btn, select, input { background:var(--panel); color:var(--text); border:none; padding:9px 14px; border-radius:9px; font-size:15px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; font-family:inherit; }
  button:hover, a.btn:hover, select:hover { background:var(--panel2); }
  button.primary { background:var(--accent); color:#08251c; font-weight:bold; }
  input { cursor:text; min-width:170px; }
  input:focus { outline:2px solid var(--accent); }

  .note { background:var(--panel); border-radius:12px; padding:14px 16px; margin-bottom:18px; font-size:14px; line-height:1.6; }
  .note.warn { border-left:4px solid var(--gold); }
  .note.ok { border-left:4px solid var(--accent); }
  .note code { background:#12131f; padding:2px 6px; border-radius:5px; font-size:13px; }
  .note b { color:var(--gold); }

  h2 { font-size:16px; text-transform:uppercase; letter-spacing:1px; opacity:.85; margin:24px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:12px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; font-size:14.5px; }
  th { background:rgba(0,0,0,.25); font-size:12px; text-transform:uppercase; letter-spacing:.5px; opacity:.8; }
  tr + tr td { border-top:1px solid rgba(255,255,255,.06); }
  tbody tr:hover { background:rgba(255,255,255,.04); }
  td.num { font-weight:bold; font-variant-numeric:tabular-nums; }
  .me { color:var(--accent); font-weight:bold; }
  .medal { font-size:16px; }
  .empty { text-align:center; opacity:.55; padding:26px 10px; font-size:14px; }
  .tag { font-size:12px; opacity:.6; }
  .wrapscroll { overflow-x:auto; border-radius:12px; }
  @media (max-width:560px){ th,td{ padding:8px 9px; font-size:13.5px; } h1{ font-size:24px; } body{ padding:16px 10px 50px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏆 ТАБЛИЦА РЕКОРДОВ</h1>
  <div class="sub">Общий зачёт по всем играм</div>

  <div class="bar">
    <a class="btn" href="index.html">← Меню</a>
    <input id="nick" placeholder="Твой ник" maxlength="16">
    <button id="saveNick" class="primary">Сохранить ник</button>
    <button id="sync">🔄 Обновить</button>
    <button id="cfg">⚙ Подключить общую таблицу</button>
  </div>

  <div id="cloudNote"></div>

  <h2>👑 Чемпионы</h2>
  <div class="wrapscroll"><table id="champs"></table></div>

  <h2>📋 Все рекорды <span class="tag" id="filterTag"></span></h2>
  <div class="bar" style="justify-content:flex-start;">
    <select id="gameFilter"><option value="">Все игры</option></select>
  </div>
  <div class="wrapscroll"><table id="all"></table></div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   ОБЩАЯ ТАБЛИЦА (сетевой режим)

   Чтобы рекорды видели ВСЕ пользователи, нужен один бесплатный
   «облачный ящик». Проще всего — Firebase Realtime Database:
     1) console.firebase.google.com → Create project (бесплатно)
     2) Build → Realtime Database → Create Database → Start in TEST mode
     3) Скопируй адрес базы вида
        https://ИМЯ-default-rtdb.firebaseio.com
     4) Вставь его ниже в CLOUD_URL и запушь.
   Всё — ник и рекорды начнут синхронизироваться у всех.
   Пока строка пустая, таблица работает только на этом устройстве.
   ───────────────────────────────────────────────────────────── */
const CLOUD_URL_BAKED = '';    // <-- сюда адрес Realtime Database (общий для всех)
// адрес можно и не вписывать в код: кнопка «⚙ Подключить» сохранит его в этом браузере
const CLOUD_URL = CLOUD_URL_BAKED || localStorage.getItem('lb_cloud') || '';

// какие игры и как считать результат
const GAMES = [
  { key:'snakeBest',      id:'snake',      name:'Змейка',         ico:'🐍', unit:'очк.',  better:'max' },
  { key:'tetrisBest',     id:'tetris',     name:'Тетрис',         ico:'🧱', unit:'очк.',  better:'max' },
  { key:'flappyBest',     id:'flappy',     name:'Flappy',         ico:'🐤', unit:'очк.',  better:'max' },
  { key:'invadersBest',   id:'invaders',   name:'Space Invaders', ico:'👾', unit:'очк.',  better:'max' },
  { key:'breakoutBest',   id:'breakout',   name:'Арканоид',       ico:'🕹️', unit:'очк.',  better:'max' },
  { key:'pacmanBest',     id:'pacman',     name:'Лабиринт',       ico:'🟡', unit:'очк.',  better:'max' },
  { key:'dinoBest',       id:'dino',       name:'Динозаврик',     ico:'🦕', unit:'очк.',  better:'max' },
  { key:'timbermanBest',  id:'timberman',  name:'Timberman',      ico:'🪓', unit:'очк.',  better:'max' },
  { key:'stackBest',      id:'stack',      name:'Stack',          ico:'🏗️', unit:'эт.',   better:'max' },
  { key:'copterBest',     id:'copter',     name:'Ракета',         ico:'🚀', unit:'очк.',  better:'max' },
  { key:'blackjackRecord',id:'blackjack',  name:'Блекджек',       ico:'🃏', unit:'фишек', better:'max' },
  { key:'colonyBest',     id:'colony',     name:'Колония',        ico:'🛰️', unit:'дн.',   better:'max' },
  { key:'survivalBest',   id:'survival',   name:'Выживание',      ico:'🌲', unit:'дн.',   better:'max' },
  { key:'raft_best',      id:'raft',       name:'Микро-Raft',     ico:'🛟', unit:'сек.',  better:'max' },
  { key:'saperBest',      id:'saper',      name:'Сапёр',          ico:'💣', unit:'сек.',  better:'min' },
  { key:'pyatnashkiBest', id:'pyatnashki', name:'Пятнашки',       ico:'🔢', unit:'ход.',  better:'min' },
  { key:'clickerBest',    id:'clicker',    name:'Кликер',         ico:'🍪', unit:'печ.',  better:'max' },
  { key:'tictactoeBest',  id:'tictactoe',  name:'Крестики',       ico:'⭕', unit:'побед', better:'max' },
  { key:'pongBest',       id:'pong',       name:'Pong',           ico:'🏓', unit:'побед', better:'max' },
  { key:'durakBest',      id:'durak',      name:'Дурак',          ico:'🎴', unit:'побед', better:'max' },
];

const LS_NICK = 'lb_nick', LS_ID = 'lb_id', LS_CACHE = 'lb_cache';

function myId() {
  let id = localStorage.getItem(LS_ID);
  if (!id) { id = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); localStorage.setItem(LS_ID, id); }
  return id;
}
function myNick() { return (localStorage.getItem(LS_NICK) || '').trim(); }

// собираем рекорды этого браузера из localStorage игр
function readLocalScores() {
  const out = {};
  for (const g of GAMES) {
    const raw = localStorage.getItem(g.key);
    if (raw === null) continue;
    const v = parseFloat(raw);
    if (isNaN(v)) continue;
    // где меньше — лучше (время, ходы), 0 — законный рекорд; где больше — лучше, 0 means «не играл»
    if (g.better === 'min' ? v >= 0 : v > 0) out[g.id] = v;
  }
  return out;
}

function myRecord() { return { id: myId(), name: myNick() || 'Без ника', scores: readLocalScores(), ts: Date.now() }; }

// ─── облако ───
const cloudOn = () => !!CLOUD_URL;
function cloudUrl(path) { return CLOUD_URL.replace(/\/$/, '') + path; }

async function cloudPush(rec) {
  if (!cloudOn()) return false;
  const body = {}; body[rec.id] = rec;
  const r = await fetch(cloudUrl('/scores.json'), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}
async function cloudPull() {
  if (!cloudOn()) return null;
  const r = await fetch(cloudUrl('/scores.json'));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  return data ? Object.values(data).filter(x => x && x.scores) : [];
}

// ─── сбор строк таблицы ───
function buildRows(players) {
  const rows = [];
  for (const p of players) for (const g of GAMES) {
    const v = p.scores && p.scores[g.id];
    if (typeof v === 'number' && v > 0) rows.push({ player: p.name || 'Без ника', pid: p.id, game: g, value: v, ts: p.ts || 0 });
  }
  return rows;
}
function rankPerGame(rows) {
  const byGame = {};
  for (const r of rows) (byGame[r.game.id] = byGame[r.game.id] || []).push(r);
  for (const id in byGame) {
    const g = byGame[id][0].game;
    byGame[id].sort((a, b) => g.better === 'min' ? a.value - b.value : b.value - a.value);
    byGame[id].forEach((r, i) => { r.place = i + 1; });
  }
  return byGame;
}
const MEDAL = { 1: '🥇', 2: '🥈', 3: '🥉' };
const fmt = v => Number.isInteger(v) ? v.toLocaleString('ru-RU') : v.toFixed(1);

function renderChamps(rows) {
  const t = document.getElementById('champs');
  const agg = {};
  for (const r of rows) {
    const a = agg[r.pid] = agg[r.pid] || { name: r.player, pid: r.pid, gold: 0, silver: 0, bronze: 0, games: 0 };
    a.games++;
    if (r.place === 1) a.gold++; else if (r.place === 2) a.silver++; else if (r.place === 3) a.bronze++;
  }
  const list = Object.values(agg).sort((a, b) => b.gold - a.gold || b.silver - a.silver || b.bronze - a.bronze || b.games - a.games);
  if (!list.length) { t.innerHTML = '<tr><td class="empty">Пока никто не играл. Сыграй в любую игру — рекорд появится здесь.</td></tr>'; return; }
  const me = myId();
  t.innerHTML = '<thead><tr><th>#</th><th>Игрок</th><th>🥇</th><th>🥈</th><th>🥉</th><th>Игр с рекордом</th></tr></thead><tbody>' +
    list.map((a, i) => '<tr><td class="num">' + (i + 1) + '</td><td class="' + (a.pid === me ? 'me' : '') + '">' + esc(a.name) + (a.pid === me ? ' (ты)' : '') +
      '</td><td class="num">' + a.gold + '</td><td class="num">' + a.silver + '</td><td class="num">' + a.bronze + '</td><td class="num">' + a.games + '</td></tr>').join('') + '</tbody>';
}
function renderAll(rows) {
  const t = document.getElementById('all'), f = document.getElementById('gameFilter').value;
  const shown = rows.filter(r => !f || r.game.id === f);
  shown.sort((a, b) => a.game.name.localeCompare(b.game.name, 'ru') || a.place - b.place);
  document.getElementById('filterTag').textContent = shown.length ? '(' + shown.length + ')' : '';
  if (!shown.length) { t.innerHTML = '<tr><td class="empty">Рекордов пока нет.</td></tr>'; return; }
  const me = myId();
  t.innerHTML = '<thead><tr><th>Игра</th><th>Место</th><th>Игрок</th><th>Результат</th></tr></thead><tbody>' +
    shown.map(r => '<tr><td>' + r.game.ico + ' ' + r.game.name + '</td><td class="medal">' + (MEDAL[r.place] || r.place) +
      '</td><td class="' + (r.pid === me ? 'me' : '') + '">' + esc(r.player) + (r.pid === me ? ' (ты)' : '') +
      '</td><td class="num">' + fmt(r.value) + ' <span class="tag">' + r.game.unit + '</span></td></tr>').join('') + '</tbody>';
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function note(html, cls) { document.getElementById('cloudNote').innerHTML = '<div class="note ' + cls + '">' + html + '</div>'; }

let players = [];
function draw() {
  const rows = buildRows(players);
  rankPerGame(rows);
  renderChamps(rows); renderAll(rows);
}

async function refresh() {
  const mine = myRecord();
  if (!cloudOn()) {
    players = [mine];
    note('📍 <b>Локальный режим</b> — таблица показывает рекорды только этого устройства.<br>' +
         'Чтобы рекорды видели все пользователи, открой <code>leaderboard.html</code> и впиши адрес бесплатной базы в <code>CLOUD_URL</code> ' +
         '(инструкция в комментарии прямо над этой строкой — 4 шага, ~2 минуты).', 'warn');
    draw(); return;
  }
  note('⏳ Синхронизация…', 'ok');
  try {
    if (mine.name !== 'Без ника' || Object.keys(mine.scores).length) await cloudPush(mine);
    const all = await cloudPull();
    players = (all && all.length) ? all : [mine];
    if (!players.some(p => p.id === mine.id)) players.push(mine);
    localStorage.setItem(LS_CACHE, JSON.stringify(players));
    note('🌐 <b>Общий режим</b> — рекорды всех игроков. Обновись, чтобы увидеть новые.', 'ok');
  } catch (e) {
    const cached = localStorage.getItem(LS_CACHE);
    players = cached ? JSON.parse(cached) : [mine];
    note('⚠️ Нет связи с общей таблицей (' + esc(e.message) + '). Показаны последние загруженные данные.', 'warn');
  }
  draw();
}

// ─── старт ───
document.getElementById('nick').value = myNick();
const sel = document.getElementById('gameFilter');
GAMES.forEach(g => { const o = document.createElement('option'); o.value = g.id; o.textContent = g.ico + ' ' + g.name; sel.appendChild(o); });
sel.addEventListener('change', draw);
document.getElementById('saveNick').addEventListener('click', () => {
  const v = document.getElementById('nick').value.trim();
  localStorage.setItem(LS_NICK, v);
  refresh();
});
document.getElementById('nick').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('saveNick').click(); });
document.getElementById('sync').addEventListener('click', refresh);
document.getElementById('cfg').addEventListener('click', () => {
  const cur = localStorage.getItem('lb_cloud') || '';
  const v = prompt('Адрес бесплатной базы Firebase Realtime Database\n' +
    '(вида https://ИМЯ-default-rtdb.firebaseio.com)\n\n' +
    'Как получить: console.firebase.google.com → Create project →\n' +
    'Build → Realtime Database → Create Database → режим Test.\n\n' +
    'Пустая строка — отключить общий режим.', cur);
  if (v === null) return;
  const url = v.trim();
  if (url) localStorage.setItem('lb_cloud', url); else localStorage.removeItem('lb_cloud');
  location.reload();
});
refresh();

if (typeof globalThis !== 'undefined') globalThis.__LB = { GAMES, buildRows, rankPerGame, readLocalScores, myRecord,
  cloudPush, cloudPull, refresh, cloudOn, myId,
  setPlayers: p => { players = p; draw(); }, getPlayers: () => players, draw };
</script>
</body>
</html>
